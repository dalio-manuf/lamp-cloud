lamp:
  feign:
    # xxl-job-admin 的地址
    job-server: http://127.0.0.1:8767
  scan:
    enabled: true
    basePackage: com.dalio.cloud
  system:
    # 登录时否验证密码有效性 （常用于开发环境快速登录）
    verifyPassword: true
    # 登录时否验证验证码有效性 （常用于开发环境快速登录）
    verifyCaptcha: true
    # 默认用户密码
    defPwd: '123456'
    # 密码最大输错次数  小于0不限制
    maxPasswordErrorNum: 10
    # 密码错误锁定用户时间  除了0表示锁定到今天结束，还支持m、h、d、w、M、y等单位
    passwordErrorLockUserTime: '0'
    # log记录 com.dalio.cloud.controller/service/biz包下 参数
    recordLamp: false
    # log记录 com.dalio.cloud.controller/service/biz包下 所有方法的参数
    recordLampArgs: true
    # log记录 com.dalio.cloud.controller/service/biz包下 所有方法的返回值
    recordLampResult: true
    # 缓存Key前缀
    cachePrefix: lb
    # oauth 服务扫描枚举类的包路径
    enumPackage: "com.dalio.cloud"
    # 演示环境启用
    notAllowWrite: false
    notAllowWriteList:
      POST:
        - /defResource
        - /defTenantApplicationRel/cancel
        - /baseRole/roleEmployee
        - /baseRole/roleResource
        - /baseEmployee/employeeRole
        - /sopPermGroupPermission/delete
      PUT:
        - /defResource
        - /defResource/moveResource
        - /defUser/resetPassword
      DELETE:
        - /defResource
        - /defResource*/**
        - /defTenant
        - /defTenant*/**
        - /defApplication
        - /defApplication*/**
        - /defUser
        - /defUser*/**
        - /baseEmployee
        - /baseEmployee*/**
        - /defParameter
        - /defParameter*/**
        - /defDict
        - /defDict*/**
        - /defClient
        - /defClient*/**
        - /defMsgTemplate*/**
        - /sopApiInfo*/**
        - /sopSysConfig*/**
        - /sopIsvInfo*/**
        - /sopPermGroup*/**
        - /sopSysConfig*/**
  ignore:
    # 是否启用网关的 uri权限鉴权 (设置为false，则后台不校验访问权限)
    authEnabled: true
    # 前端校验按钮 是否区分大小写
    caseSensitive: false
    # 系统没有配置某个URI时，是否允许访问
    notConfigUriAllow: false
    anyone: # 请求中 需要携带Tenant 且 需要携带Token(不需要登录)，但不需要验证uri权限
      ALL:
        - /anyone/**
        - /service/model/*/json
        - /service/model/*/save
        - /service/editor/stencilset
    anyUser: # 请求中 需要携带Tenant，但 不需要携带Token(不需要登录) 和 不需要验证uri权限
      ALL:
        - /anyUser/**
    anyTenant: # 请求中 不需要携带Tenant 且 不需要携带Token(不需要登录) 和 不需要验证uri权限
      ALL:
        - /anyTenant/**
  echo: #详情看: EchoProperties
    # 是否启用 远程数据 手动注入
    enabled: true
    # 是否启用 远程数据 注解AOP注入
    aop-enabled: true
    # 字典类型 和 code 的分隔符
    dictSeparator: '###'
    # 多个字典code 之间的的分隔符
    dictItemSeparator: ','
    # 递归最大深度
    maxDepth: 3
    # 本地缓存配置信息 生产慎用
    guavaCache:
      enabled: false
      maximumSize: 1000
      refreshWriteTime: 2
      refreshThreadPoolSize: 10
  webmvc:
    undertow: true
    header: false
  log: # 详情看：OptLogProperties
    # 开启记录操作日志
    enabled: true
    # 记录到什么地方  DB:mysql LOGGER:日志文件
    type: DB
    ipv4:
      enabled: true
      xdbPath: file:./doc/ip2region_v4.xdb
    ipv6:
      enabled: true
      xdbPath: file:./doc/ip2region_v6.xdb
  xss:
    # 是否开启 xss 过滤器  详情看：XssProperties
    enabled: true
    requestBodyEnabled: false
  captcha:
    # 登录界面的验证码配置 详情看：CaptchaProperties
    type: ARITHMETIC
    width: 158
    height: 58
    len: 2
    charType: 2
  async: # 全局线程池配置
    corePoolSize: 2
    maxPoolSize: 50
    queueCapacity: 10000
    keepAliveSeconds: 300
    threadNamePrefix: 'lamp-async-executor-'
  generator:
    outputDir: /data/projects/lamp-cloud
    frontOutputDir: /data/projects/lamp-web
    frontSoyOutputDir: /data/projects/lamp-web-pro-soybean
    frontVben5OutputDir: /data/projects/lamp-web-vben-max/apps/web-antd
    # 作者
    author: admin
    # 默认项目
    projectType: BOOT
    #  # 去除表前缀
    #  tablePrefix:
    #    - xxx_
    #  # 去除字段前缀
    #  fieldPrefix:
    #    - xxx_
    #  # 去除字段后缀
    #  fieldSuffix:
    #    - xxx_
    # 项目前缀
    projectPrefix: 'lamp'
    superClass: SUPER_CLASS
    # 生成方式
    genType: GEN
    packageInfoConfig: # 其他配置建议保持PackageInfoConfig中的默认值
      # 生成代码位于 src/main/java 下的基础包
      parent: 'com.dalio.cloud'
      utilParent: 'com.dalio.basic'
    entity-config:
      # 时间类型对应策略  ONLY_DATE: java.util  SQL_PACK:java.sql  TIME_PACK: java.time
      dateType: TIME_PACK
      # Entity类的父类
      entitySuperClass: ENTITY
      # 指定生成的主键的ID类型 (${superClass} == NONE 时，新生成的实体才生效)
      idType: INPUT
      # 数据库表字段映射到实体的命名策略
      columnNaming: underline_to_camel
      # 忽略字段（字段名）
      # ignoreColumns:
      #   - xxx
      # 【实体】 是否生成字段常量
      columnConstant: false
      # 【实体、VO】是否为链式模型
      chain: true
      # 【实体、VO】 是否为lombok模型
      lombok: true
      # 乐观锁字段名称
      versionColumnName: ''
      # 乐观锁属性名称
      versionPropertyName: ''
      # 逻辑删除字段名称
      logicDeleteColumnName: ''
      # 逻辑删除属性名称
      logicDeletePropertyName: ''
      fillColumnName:
        xxx: INSERT
      # 格式化SaveVO文件名称
      formatSaveVoFileName: ''
      # 格式化UpdateVO文件名称
      formatUpdateVoFileName: ''
      # 格式化ResultVO文件名称
      formatResultVoFileName: ''
      # 格式化 PageQuery 文件名称
      formatPageQueryFileName: ''
    mapperConfig:
      formatMapperFileName: ''
      formatXmlFileName: ''
      mapperAnnotation: false
      baseResultMap: true
      cache: false
      baseColumnList: true
      cacheClass: org.apache.ibatis.cache.decorators.LoggingCache
    #  serviceConfig:
    #  managerConfig:
    #  controllerConfig:
    #  webProConfig:
    fileOverrideStrategy:
      entityFileOverride: OVERRIDE
      sqlFileOverride: OVERRIDE
      mapperFileOverride: EXIST_IGNORE
      xmlFileOverride: OVERRIDE
      managerFileOverride: EXIST_IGNORE
      serviceFileOverride: EXIST_IGNORE
      controllerFileOverride: EXIST_IGNORE
      apiModelFileOverride: OVERRIDE
      langFileOverride: OVERRIDE
      indexEditTreeFileOverride: EXIST_IGNORE
      dataFileOverride: EXIST_IGNORE
    constantsPackage:
      # 业务服务 后台手动改动过的枚举
      FieldFill: com.baomidou.mybatisplus.annotation.FieldFill
      SuperClassEnum: com.dalio.cloud.generator.enumeration.SuperClassEnum
      EntitySuperClassEnum: com.dalio.cloud.generator.enumeration.EntitySuperClassEnum
      # common 常量
      EchoDictType: com.dalio.cloud.model.constant.EchoDictType
      EchoApi: com.dalio.cloud.model.constant.EchoApi
      # common 公共枚举
      HttpMethod: com.dalio.cloud.model.enumeration.HttpMethod
      BooleanEnum: com.dalio.cloud.model.enumeration.BooleanEnum
      StateEnum: com.dalio.cloud.model.enumeration.StateEnum
      UserStatusEnum: com.dalio.cloud.model.enumeration.base.UserStatusEnum
      RoleCategoryEnum: com.dalio.cloud.model.enumeration.base.RoleCategoryEnum
      ActiveStatusEnum: com.dalio.cloud.model.enumeration.base.ActiveStatusEnum
      OrgTypeEnum: com.dalio.cloud.model.enumeration.base.OrgTypeEnum
      FileType: com.dalio.cloud.model.enumeration.base.FileType
      DateType: com.dalio.cloud.model.enumeration.base.DateType
      DictClassifyEnum: com.dalio.cloud.model.enumeration.system.DictClassifyEnum
      DefTenantStatusEnum: com.dalio.cloud.model.enumeration.system.DefTenantStatusEnum
      DataTypeEnum: com.dalio.cloud.model.enumeration.system.DataTypeEnum
      TenantConnectTypeEnum: com.dalio.cloud.model.enumeration.system.TenantConnectTypeEnum

spring:
  config:
    # 配置优先级： ./application-${spring.profiles.active}.yml >= ./application.yml >= /config/${spring.profiles.active}/*.yml  >= bootstrap-${spring.profiles.active}.yml >= bootstrap.yml
    # import的文件顺序越靠后，优先级越大
    import:
      - classpath:config/${spring.profiles.active}/common.yml
      - classpath:config/${spring.profiles.active}/doc.yml
      - classpath:config/${spring.profiles.active}/oss.yml
      - classpath:config/${spring.profiles.active}/sa-token.yml
      - classpath:config/${spring.profiles.active}/rabbitmq.yml
      - classpath:config/${spring.profiles.active}/redis.yml
      - classpath:config/${spring.profiles.active}/mysql.yml
  mvc:
    pathmatch:
      # 升级springboot2.6.6后临时处理，防止swagger报错
      matching-strategy: ANT_PATH_MATCHER
  lifecycle:
    # 优雅停机宽限期时间
    timeout-per-shutdown-phase: 30s
  servlet:
    # 上传文件最大值
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB
  main:
    allow-bean-definition-overriding: true
  application:
    name: '@project.artifactId@'
    # 单体版不需要配置这个配置
    path: ''
  profiles:
    active: '@profile.active@'

server:
  # 优雅停机
  shutdown: GRACEFUL
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: '*'
  endpoint:
    shutdown:
      access: unrestricted
    health:
      show-details: ALWAYS


logging:
  file:
    path: '@logging.file.path@'
    name: ${logging.file.path}/${spring.application.name}/root.log
  level:
    root: INFO
    # 关闭不必要的日志
    org.reflections.Reflections: off
    com.alibaba.nacos.client: error
    com.alibaba.nacos.common.remote.client: error
    com.ulisesbocchio: error
    # 开发、调试需要的日志
    com.dalio.basic: info
    com.dalio.cloud: info
    org.springframework: info
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
    console: "[${spring.application.name}:%X{TenantId}:%X{UserId}] %d{yyyy-MM-dd HH:mm:ss.SSS}[%5p] ${PID} [%X{trace}] [%t:%r] [%logger{50}.%M:%L] %m%n"
  logback:
    rollingpolicy:
      max-file-size: 64MB

info:
  name: '@project.name@'
  description: '@project.description@'
  version: '@project.version@'