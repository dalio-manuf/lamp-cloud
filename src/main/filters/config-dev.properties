# ==============================================================================
# lamp-cloud 本地开发环境基础配置 (dev)
# 对应 Maven Profile: dev
# ==============================================================================

# ------------------------------------------------------------------------------
# Nacos 配置中心与注册中心
# ------------------------------------------------------------------------------
nacos.ip=127.0.0.1
nacos.port=8848
# Nacos 命名空间 ID (留空表示使用默认 public 空间；若在 Nacos 中创建了 dev 命名空间，请填入对应的 Namespace ID)
nacos.namespace=
nacos.username=nacos
nacos.password=nacos

# ------------------------------------------------------------------------------
# Seata 分布式事务协调器 (可选)
# ------------------------------------------------------------------------------
seata.ip=127.0.0.1
seata.port=8091
# Seata 客户端从 Nacos 拉取配置和注册的命名空间 (需与 nacos.namespace 区分时配置，默认可留空)
seata.namespace=

# ------------------------------------------------------------------------------
# 日志存储与监控组件
# ------------------------------------------------------------------------------
logging.file.path=./logs
sentinel.dashboard=127.0.0.1:8088

# ------------------------------------------------------------------------------
# 业务数据库方言配置文件
# 可选值: mysql.yml | dameng.yml | oracle.yml | sqlserver.yml
# ------------------------------------------------------------------------------
database.type=mysql.yml