# ==============================================================================
# lamp-cloud 生产运行环境基础配置 (prod)
# 对应 Maven Profile: prod
# ==============================================================================

# ------------------------------------------------------------------------------
# Nacos 配置中心与注册中心
# ------------------------------------------------------------------------------
# 生产环境 Nacos 服务器 IP 或集群域名
nacos.ip=127.0.0.1
nacos.port=8848
# 生产环境 Nacos 命名空间 ID (建议按需在 Nacos 控制台创建独立 prod 命名空间后填入)
nacos.namespace=prod
nacos.username=nacos
# 生产环境 Nacos 访问密码 (部署前务必按实际生产密码修改)
nacos.password=nacos

# ------------------------------------------------------------------------------
# Seata 分布式事务协调器 (可选)
# ------------------------------------------------------------------------------
# Seata 客户端从 Nacos 拉取配置和注册的命名空间 (需与 nacos.namespace 区分时配置)
seata.namespace=seata_prod
# Seata TC Server 节点 IP 或 VIP
seata.ip=127.0.0.1
seata.port=8091

# ------------------------------------------------------------------------------
# 日志存储与监控组件
# ------------------------------------------------------------------------------
# 生产环境统一微服务日志存储根目录
logging.file.path=/data_prod/logs
sentinel.dashboard=127.0.0.1:8088

# ------------------------------------------------------------------------------
# 业务数据库方言配置文件
# 可选值: mysql.yml | dameng.yml | oracle.yml | sqlserver.yml
# ------------------------------------------------------------------------------
database.type=mysql.yml